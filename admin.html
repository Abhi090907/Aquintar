<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquintar - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10 font-sans">

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-blue-900">Partner Inquiries</h1>
            <button onclick="fetchMessages()" class="bg-blue-900 text-white px-4 py-2 rounded hover:bg-blue-800">Refresh Data</button>
        </div>

        <div class="bg-white shadow-xl rounded-lg overflow-hidden">
            <table class="min-w-full leading-normal">
                <thead>
                    <tr>
                        <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Date</th>
                        <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Name / Cafe</th>
                        <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Email</th>
                        <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Message</th>
                    </tr>
                </thead>
                <tbody id="messagesTable">
                    <!-- Data will appear here -->
                    <tr>
                        <td colspan="4" class="px-5 py-5 border-b border-gray-200 bg-white text-sm text-center">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="mt-4 text-center">
            <a href="index.html" class="text-blue-600 hover:underline">← Back to Website</a>
        </div>
    </div>

    <script>
        async function fetchMessages() {
            try {
                const response = await fetch('http://localhost:3000/api/contacts');
                const json = await response.json();
                const tbody = document.getElementById('messagesTable');

                if (json.data && json.data.length > 0) {
                    tbody.innerHTML = json.data.map(msg => `
                        <tr>
                            <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm text-gray-500">
                                ${new Date(msg.timestamp).toLocaleString()}
                            </td>
                            <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm font-bold text-gray-900">
                                ${msg.name}
                            </td>
                            <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm text-blue-600">
                                <a href="mailto:${msg.email}">${msg.email}</a>
                            </td>
                            <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm text-gray-700">
                                ${msg.message}
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" class="px-5 py-5 border-b border-gray-200 bg-white text-sm text-center text-gray-500">No inquiries yet.</td></tr>';
                }
            } catch (error) {
                document.getElementById('messagesTable').innerHTML = '<tr><td colspan="4" class="px-5 py-5 text-center text-red-500">Error fetching data. Is the server running?</td></tr>';
            }
        }

        // Fetch on load
        fetchMessages();
    </script>
</body>
</html>
